name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - master
      - "devin/**"

# Cancel in-progress runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # CI does not run the app, so all secrets here are throwaway placeholders.
    # `lib/db` opens its connection lazily, so a fake DATABASE_URL is safe; we
    # set it anyway to keep `next build` quiet about missing envs.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      AUTH_SECRET: ci-secret-not-used-anywhere
      OPENAI_API_KEY: sk-ci-not-used

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
